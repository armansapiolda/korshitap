# Alembic config. The database URL is taken from app settings (DATABASE_URL in .env).
# Usually you do not need to run alembic by hand: init_db() upgrades the schema on start.
#   .venv/bin/alembic upgrade head        # apply migrations
#   .venv/bin/alembic revision --autogenerate -m "..."   # after changing app/db/models.py

[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
