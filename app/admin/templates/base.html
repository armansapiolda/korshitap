<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KORSHI TAP — Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
  <!-- Navigation Bar -->
  <nav class="bg-gray-800 border-b border-gray-700 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <span class="text-2xl">🏔</span>
          <span class="font-bold text-xl text-indigo-400">KORSHI TAP</span>
          <span class="text-xs bg-indigo-900 text-indigo-300 font-semibold px-2 py-0.5 rounded border border-indigo-700">Алматы</span>
        </div>
        <div class="flex space-x-2">
          <a href="/admin" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-gray-700">📊 Дашборд</a>
          <a href="/admin/users" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-gray-700">👥 Пользователи</a>
          <a href="/admin/listings" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-gray-700">🏠 Объявления</a>
          <a href="/admin/matches" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-gray-700">❤️ Матчи</a>
          <a href="/admin/reports" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-gray-700">🚩 Жалобы</a>
          <a href="/admin/weights" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-gray-700">⚙️ Веса AI</a>
          <a href="/admin/seed" class="px-3 py-2 rounded-md text-sm font-medium bg-indigo-600 hover:bg-indigo-500 text-white">🧪 Тест-данные</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Content Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
